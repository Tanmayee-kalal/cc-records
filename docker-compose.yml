services:
  webpage:
    build: .
    container_name: microservice-webpage
    ports:
      - "8080:80"

  product:
    build:
      context: ./backend
      dockerfile: product/Dockerfile
    container_name: product-service
    ports:
      - "5001:5001"

  order:
    build:
      context: ./backend
      dockerfile: order/Dockerfile
    container_name: order-service
    ports:
      - "5002:5002"
    depends_on:
      - product
      - payment

  payment:
    build:
      context: ./backend
      dockerfile: payment/Dockerfile
    container_name: payment-service
    ports:
      - "5003:5003"